name: Build, tag and deploy
# https://www.programonaut.com/how-to-deploy-a-git-repository-to-a-server-using-github-actions/

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write   # allows pushing Git tags

# Two quick merges must not compute the same version
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  push_to_registry:
    name: Build and push Docker image to Docker Hub
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Determine next version from last tag
      id: semver
      env:
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        # Fetch all tags (sometimes needed explicitly)
        git fetch --tags --prune

        # Get the latest tag, or 0.0.0 if none
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
        echo "Latest tag: $LATEST_TAG"

        MAJOR=$(echo "$LATEST_TAG" | cut -d '.' -f 1)
        MINOR=$(echo "$LATEST_TAG" | cut -d '.' -f 2)
        PATCH=$(echo "$LATEST_TAG" | cut -d '.' -f 3)

        NEXT_MAJOR=$MAJOR
        NEXT_MINOR=$MINOR
        NEXT_PATCH=$((PATCH + 1))

        # Check commit message for [major] or [minor]
        if [[ "$COMMIT_MESSAGE" =~ \[major\] ]]; then
          NEXT_MAJOR=$((MAJOR + 1))
          NEXT_MINOR=0
          NEXT_PATCH=0
        elif [[ "$COMMIT_MESSAGE" =~ \[minor\] ]]; then
          NEXT_MINOR=$((MINOR + 1))
          NEXT_PATCH=0
        fi

        NEXT_VERSION="${NEXT_MAJOR}.${NEXT_MINOR}.${NEXT_PATCH}"
        echo "Computed next version: $NEXT_VERSION"

        # Export variables
        echo "VERSION=$NEXT_VERSION" >> $GITHUB_ENV
        echo "MAJOR=$NEXT_MAJOR" >> $GITHUB_ENV

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          sebulino/meine-piraten-server:latest
          sebulino/meine-piraten-server:${{ env.VERSION }}
          sebulino/meine-piraten-server:v${{ env.MAJOR }}

    - name: Push new Git tag
      run: |
        # Configure Git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Tag every release so the next run computes a new version
        # and every Docker Hub image has a unique version to roll back to
        git tag "${{ env.VERSION }}" -m "ci: release version ${{ env.VERSION }}"
        git push origin "${{ env.VERSION }}"

    # Deployment is done manually on the server (update script pulls from Docker Hub).
    # Kept for reference; uncomment to deploy automatically after the push.
