name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    # Nightly audit: catches new advisories against an unchanged lockfile
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  security:
    name: Security (Brakeman, bundler-audit, importmap)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan Rails code for security vulnerabilities
        run: bin/brakeman --no-pager

      - name: Check gems for known vulnerabilities
        run: bundle exec bundle-audit check --update

      - name: Check JavaScript pins for known vulnerabilities
        run: bin/importmap audit

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        run: bin/rails db:test:prepare test

  system_test:
    name: System tests (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run system tests
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: meine-piraten-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container
        run: |
          docker run -d --name app -p 3000:80 \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            -e KEYCLOAK_CLIENT_SECRET=ci-dummy \
            -e TELEGRAM_POLL_ENABLED=false \
            meine-piraten-server:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/up > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000/up > /dev/null
          curl -fsS http://localhost:3000/api/news.json | jq -e 'type == "array" or type == "object"' > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/messages.json)" = "401"

      - name: Container logs
        if: always()
        run: docker logs app
