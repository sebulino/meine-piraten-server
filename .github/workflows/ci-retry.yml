name: CI retry

# Re-runs failed CI jobs once, one hour later, when they failed in a setup
# step (checkout, setup-ruby, buildx). Those failures are GitHub/download
# outages such as HTTP 504s from release downloads, not problems in our code.
# Failures in steps that run our code (tests, rubocop, bundle-audit, ...) are
# never retried.
#
# Note: workflow_run triggers only use the copy of this file on the default
# branch, so changes here take effect after merging to main.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]

permissions:
  actions: write

jobs:
  retry:
    name: Re-run infrastructure failures
    # Only the first attempt, so a retry can never trigger another retry.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      # Passed via env, never interpolated into the script: branch names of
      # fork PRs are attacker-controlled.
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check that only setup steps failed
        id: classify
        run: |
          infra='^(Set up job|Run (actions/checkout|ruby/setup-ruby|docker/setup-buildx-action)@)'

          failed_steps=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/1/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name')

          echo "Failed steps:"
          echo "$failed_steps"

          if [ -z "$failed_steps" ]; then
            echo "No failed step found, not retrying."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          elif echo "$failed_steps" | grep -Evq "$infra"; then
            echo "At least one failure is in a step that runs our code, not retrying."
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only setup steps failed, retrying in one hour."
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait one hour
        if: steps.classify.outputs.retry == 'true'
        run: sleep 3600

      - name: Re-run failed jobs
        if: steps.classify.outputs.retry == 'true'
        run: |
          # CI cancels in-progress runs of the same ref. If a newer CI run
          # exists on this branch, re-running the old one could cancel it, and
          # the newer run already answers the question anyway.
          latest=$(gh run list --workflow CI --branch "$HEAD_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$latest" != "$RUN_ID" ]; then
            echo "Newer CI run $latest exists on this branch, skipping retry of $RUN_ID."
            exit 0
          fi

          gh run rerun "$RUN_ID" --failed
